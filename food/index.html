var BACK = "../";          // 목차로 돌아가는 링크. 허브 자신은 null.
var KEY = 'trip-unlock';
function b(s){var r=atob(s),a=new Uint8Array(r.length);
 for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}

async function decrypt(pw){
  if(!crypto.subtle) throw new Error('nosubtle');   // http 등 비보안 출처
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
    'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b(C.salt),iterations:C.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(C.iv)},key,b(C.data));
  return new TextDecoder().decode(out);
}

// document.write로 문서를 갈아엎지 않는다 —
// 그러면 비밀번호 관리자의 「저장할까요?」 프롬프트도 같이 사라진다.
function addBack(){
  if(!BACK) return;
  var a=document.createElement('a');
  a.href=BACK; a.textContent='← 목차';
  a.style.cssText='position:fixed;left:12px;top:12px;z-index:99999;'+
    'background:rgba(255,255,255,.94);border:1px solid #e4dfd5;border-radius:8px;'+
    'padding:6px 11px;font:13px -apple-system,"Segoe UI","Malgun Gothic",sans-serif;'+
    'color:#8a5a2b;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.08)';
  document.body.appendChild(a);
}

// 외부 스크립트는 로드가 끝나기를 기다렸다가 다음 것을 붙인다.
// 그냥 붙이면 async라 순서가 깨진다 — Leaflet이 오기 전에
// L을 쓰는 코드가 먼저 돌아 지도가 안 그려졌다.
async function runScripts(root){
  var list = root.querySelectorAll('script');   // Document이면 head+body 모두
  for (var i=0; i<list.length; i++){
    var old = list[i];
    await new Promise(function(done){
      var n = document.createElement('script');
      for (var j=0; j<old.attributes.length; j++){
        var at = old.attributes[j];
        n.setAttribute(at.name, at.value);
      }
      if (old.src){
        n.async = false;
        n.onload = done; n.onerror = done;
        document.body.appendChild(n);
      } else {
        n.textContent = old.textContent;
        document.body.appendChild(n);
        done();
      }
    });
  }
}

async function reveal(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var old=document.getElementById('lockcss'); if(old) old.remove();
  doc.head.querySelectorAll('style').forEach(function(s){document.head.appendChild(s);});
  doc.head.querySelectorAll('link[rel=stylesheet]').forEach(function(s){document.head.appendChild(s);});
  document.body.innerHTML=doc.body.innerHTML;   // innerHTML로는 script가 안 돌아간다
  addBack();
  window.scrollTo(0,0);
  await runScripts(doc);   // head에 있는 <script src>까지 문서 순서대로
}

function remember(pw, persist){
  try{sessionStorage.setItem(KEY,pw);}catch(_){}          // 이번 방문 동안
  if(persist){ try{localStorage.setItem(KEY,pw);}catch(_){} }
}
function forget(){
  try{sessionStorage.removeItem(KEY);}catch(_){}
  try{localStorage.removeItem(KEY);}catch(_){}
}

document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var btn=document.getElementById('b'), err=document.getElementById('e');
  btn.disabled=true; btn.textContent='여는 중…'; err.textContent='';
  try{
    var pw=document.getElementById('p').value;
    var html=await decrypt(pw);
    remember(pw, document.getElementById('rm').checked);
    await reveal(html);
  }catch(ex){
    err.textContent = (ex && ex.message==='nosubtle')
      ? '이 브라우저에서는 열 수 없습니다 (https로 접속해 주세요).'
      : '비밀번호가 맞지 않습니다.';
    btn.disabled=false; btn.textContent='열기';
    document.getElementById('p').select();
  }
});

// 이미 푼 적이 있으면 묻지 않고 연다. 실패하면 조용히 지우고 폼을 보여준다.
(async function(){
  var saved=null;
  try{saved=sessionStorage.getItem(KEY);}catch(_){}
  if(!saved){ try{saved=localStorage.getItem(KEY);}catch(_){} }
  if(!saved) return;
  try{ var html=await decrypt(saved); remember(saved,false); await reveal(html); }
  catch(_){ forget(); }
})();
</script>
